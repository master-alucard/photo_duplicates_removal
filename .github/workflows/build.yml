name: Build Windows Installer

# Trigger on any version tag (e.g. v1.0.0, v1.2.3)
on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases and upload assets
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      # Pin to 3.12 — PyInstaller does not yet support 3.13+
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install all dependencies (including rawpy) ────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Verify rawpy + LibRaw DLL are importable ──────────────────────────
      - name: Verify rawpy installation
        run: |
          python -c "import rawpy; print('rawpy OK —', rawpy.__version__)"
          python -c "from PIL import Image; import imagehash, piexif, pywt; print('Core deps OK')"

      # ── 4b. Run test suite ────────────────────────────────────────────────────
      - name: Install test extras
        run: pip install pytest pytest-github-actions-annotate-failures

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -rA -q --tb=short 2>&1 | tee pytest-out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Emit one GitHub annotation per failing/erroring test so the cause
            # is visible via the check-runs API without the full log. (pwsh
            # mangled native stderr; bash handles it cleanly.)
            grep -E "^(FAILED|ERROR)" pytest-out.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::group::pytest tail"
            tail -50 pytest-out.txt
            echo "::endgroup::"
          fi
          exit $code

      # ── 5. Bundle with PyInstaller ───────────────────────────────────────────
      - name: Build EXE with PyInstaller
        run: pyinstaller image_deduper.spec

      # ── 6. Verify the EXE was produced ───────────────────────────────────────
      - name: Check output
        run: |
          if (!(Test-Path "dist\ImageDeduper\ImageDeduper.exe")) {
            Write-Error "ImageDeduper.exe not found — PyInstaller build failed"
            exit 1
          }
          Write-Host "ImageDeduper.exe found — $(Get-Item dist\ImageDeduper\ImageDeduper.exe | Select-Object -ExpandProperty Length) bytes"

      # ── 7. Install Inno Setup ─────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # ── 8. Extract version from the tag (strips leading "v") ─────────────────
      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # ── 9. Patch the installer version in installer.iss ───────────────────────
      - name: Patch version in installer.iss
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer\installer.iss) `
            -replace '#define AppVersion\s+"[^"]+"', "#define AppVersion `"$ver`"" |
            Set-Content installer\installer.iss
          Write-Host "installer.iss patched to version $ver"

      # ── 9b. Patch the in-app version string in about_tab.py ──────────────────
      - name: Patch version in about_tab.py
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content about_tab.py) `
            -replace 'APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION   = `"$ver`"" |
            Set-Content about_tab.py
          Write-Host "about_tab.py patched to version $ver"

      # ── 10. Build the installer ───────────────────────────────────────────────
      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 11. Rename installer to include version in filename ───────────────────
      - name: Rename installer
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = Get-ChildItem installer\installer_output\*.exe | Select-Object -First 1
          $dst = "installer\installer_output\ImageDeduper-Setup-$ver.exe"
          Move-Item $src.FullName $dst
          Write-Host "Installer: $dst"

      # ── 12. Upload installer as a build artifact ──────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageDeduper-Setup-${{ steps.version.outputs.VERSION }}
          path: installer\installer_output\*.exe
          retention-days: 90

      # ── 13. Create GitHub Release and attach the installer ────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image Deduper ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's new in ${{ steps.version.outputs.VERSION }}

            ### Fixed: black window cascade during video scans
            - **No more console windows popping up while scanning videos.** Every video probe spawned a visible black console window; on large or damaged video collections these cascaded across the whole screen. All background ffmpeg work is now fully hidden.
            - **Live progress during video analysis.** The scan previously appeared frozen at "Indexing video N/N" while frames were being extracted. It now shows "Extracting frames from video i/N" as it works, and the Stop button interrupts this phase promptly.

            ### Reliability
            - **Much lower memory use when reviewing video results.** Video previews are now stored downscaled instead of as full-resolution frames, preventing gigabytes of memory buildup on large video collections.
            - **Moving duplicates to trash now uses the folder from scan time.** Editing the output folder field after a scan no longer redirects files to an unexpected location.

            ### New: command-line mode
            - Scan and clean image duplicates from scripts (when running from the Python source; see the README): `deduper.py --scan <folder> [--threshold 90] [--auto-move-trash] [--out <folder>]`. Dry-run by default; moves are logged and revertable from the GUI.

            > Builds on v1.2.0 (Merge tab, drive-disconnect auto-resume, crash-safe cache).

            ---

            ## Installation
            Download **ImageDeduper-Setup-${{ steps.version.outputs.VERSION }}.exe** below and run it.

            **Includes:** Python runtime and all dependencies (Pillow, imagehash, rawpy + LibRaw, piexif, PyWavelets, NumPy, SciPy) — no separate Python installation needed.
          files: installer\installer_output\*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
